<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New World">
<meta name="description" content="New World — jeux de soirée : Action ou Vérité, Incognito et Blitz. Par Thousand Labs Games.">
<title>New World — Thousand Labs Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<style>:root{
  --bg:#0d0b1a;--bg2:#161330;--card:#1e1a3d;--card2:#272250;--line:#352f66;
  --txt:#f3f1ff;--mut:#a7a2cc;--pri:#8b5cf6;--pri2:#ec4899;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
  --soft:#38bdf8;--hard:#f59e0b;--spicy:#f97316;--extreme:#ef4444;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a1d5c 0%,var(--bg) 60%) fixed}
#app{max-width:560px;margin:0 auto;padding:16px 16px 90px;min-height:100vh}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.1rem}
p{line-height:1.5}
.mut{color:var(--mut)}.small{font-size:.85rem}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--card2);cursor:pointer;width:100%;display:block;margin:8px 0;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2))}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn);color:#1b1300}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:9px 12px;font-size:.92rem;width:auto;display:inline-block;margin:4px}
.btn[disabled]{opacity:.4}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.logo{font-weight:900;font-size:2.6rem;letter-spacing:-1px;background:linear-gradient(135deg,#a78bfa,#f472b6,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0 0}
.game{border-radius:22px;padding:20px;margin:14px 0;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line)}
.game h2{margin:0 0 4px}.game p{margin:0;color:#e9e5ff}
.game.tod{background:linear-gradient(135deg,#7c3aed,#db2777)}
.game.intrus{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.game.party{background:linear-gradient(135deg,#f97316,#e11d48)}
.game .emo{position:absolute;right:14px;top:10px;font-size:3rem;opacity:.9}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);margin:4px 4px 4px 0;cursor:pointer;font-size:.95rem;user-select:none}
.pill.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;font-weight:700}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.lv-soft{background:var(--soft);color:#00222f}.lv-hard{background:var(--hard);color:#2a1800}.lv-spicy{background:var(--spicy);color:#2a0d00}.lv-extreme{background:var(--extreme);color:#fff}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem;font-family:inherit}
textarea{min-height:80px}
label.lb{display:block;margin:12px 0 6px;color:var(--mut);font-size:.9rem;font-weight:600}
.player{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px;font-size:.88rem;font-weight:700;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.switch:last-child{border-bottom:0}
.tg{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ok)}.tg.on::after{left:25px}
.bigcard{border-radius:24px;padding:26px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;margin:14px 0;border:1px solid var(--line);background:var(--card);animation:pop .35s ease}
.bigcard .q{font-size:1.45rem;font-weight:800;line-height:1.3;margin:14px 0}
.bigcard.v{background:linear-gradient(160deg,#1e3a8a,#312e81)}
.bigcard.a{background:linear-gradient(160deg,#9d174d,#7c2d12)}
.bigcard.sp{background:linear-gradient(160deg,#065f46,#1e3a8a)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.choice{display:flex;gap:12px}.choice .btn{font-size:1.3rem;padding:26px 10px}
.choice .v{background:linear-gradient(160deg,#2563eb,#4f46e5)}.choice .a{background:linear-gradient(160deg,#db2777,#ea580c)}
.banner{background:#3b2a0b;border:1px solid #f59e0b;color:#fde68a;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600}
.banner.info{background:#0c2a3b;border-color:#38bdf8;color:#bae6fd}
.timer{font-size:2.6rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.wheelbox{position:relative;width:min(320px,80vw);margin:10px auto}
.wheelbox canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 2px 3px #000)}
.who{font-size:1.9rem;font-weight:900;text-align:center;margin:8px 0}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 8px;color:var(--txt);font-weight:800;font-size:1.05rem;cursor:pointer}
.pbtn.dead{opacity:.35;text-decoration:line-through}
.pbtn.sel{outline:3px solid var(--pri2)}
.secret{background:linear-gradient(160deg,#1e1b4b,#3b0764);border-radius:24px;padding:26px;text-align:center;border:1px solid var(--line);margin:14px 0}
.word{font-size:2.3rem;font-weight:900;margin:10px 0}
.role{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-top:14px;text-align:left}
.modal{position:fixed;inset:0;background:rgba(5,3,15,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.trial{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9rem;text-align:center;margin:10px 0}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all;font-size:1.05rem;text-align:center}
.score td{padding:6px 8px}.score{width:100%;border-collapse:collapse}.score tr+tr td{border-top:1px solid var(--line)}
.title-award{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.title-award .e{font-size:2rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
.foot{text-align:center;color:var(--mut);font-size:.8rem;margin-top:26px}
.foot a{color:var(--mut)}
.counter{display:flex;align-items:center;gap:10px}.counter button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:1.3rem;cursor:pointer}
.counter b{min-width:28px;text-align:center;font-size:1.2rem}
.rolechip{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.rolechip.on{border-color:var(--pri2);background:#2a1640}
.rolechip .e{font-size:1.6rem}

.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.back .ic{width:22px;height:22px;vertical-align:middle}
.game .emo .ic{width:52px;height:52px;stroke-width:1.6;opacity:.85}
.rolechip .e .ic{width:26px;height:26px;stroke-width:1.7;color:#c4b5fd}
.cc{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.5px;padding:1px 5px;border-radius:5px;background:#ffffff22;margin-right:3px;vertical-align:1px}
.choice .ic{width:28px;height:28px}
.title-award .e .ic{width:30px;height:30px;color:#fbbf24}
.secret .word .ic{width:56px;height:56px}
.game.blitz{background:linear-gradient(135deg,#059669,#ca8a04)}
.blteam{border:1px solid;border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--bg2)}
.tagteam{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;color:#fff;margin:8px 0 0}
.bltimer{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.bltimer.hot{color:#f87171;animation:blpulse .5s infinite alternate}
@keyframes blpulse{to{transform:scale(1.12)}}
.blbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0}
.blbar div{height:100%;transition:width .2s linear}
.blword{min-height:250px;border-width:2px}
.blword .q{word-break:break-word;line-height:1.15}
.btn.blfound{background:linear-gradient(160deg,#16a34a,#059669)}
.btn.blpass{background:var(--card2)}
.choice .btn.blfound,.choice .btn.blpass{font-size:1.35rem;padding:34px 10px}
.blcount{font-size:7rem;font-weight:900;animation:pop .35s ease}
.blround{background:linear-gradient(160deg,#065f46,#854d0e)}
.blic .ic{width:48px;height:48px}
.blic.big .ic{width:64px;height:64px;color:#fbbf24}
</style>

rulesTod:["• Entrez les joueurs, choisissez un mode et des niveaux.\n• La roue désigne un joueur : il choisit Action ou Vérité.\n• « Fait » s'il relève le défi, « Joker » pour passer (3 par partie). Sans joker, le groupe choisit le gage.\n• Les cartes [[i:hand]] ne visent que les joueurs qui acceptent le contact, et la personne visée peut toujours refuser sans pénalité.\n• Cartes spéciales : Duel, Tout le monde, Vote, Règle (3 tours), Inversion.","• Enter players, choose a mode and levels.\n• The wheel picks a player: they choose Truth or Dare.\n• \"Done\" if they do it, \"Joker\" to skip (3 per game). With no jokers left, the group picks the forfeit.\n• [[i:hand]] cards only target players who accept contact, and the targeted person can always refuse with no penalty.\n• Special cards: Duel, Everyone, Vote, Rule (3 turns), Reverse."],
rulesIntrus:["• Les Civils ont tous le même mot. Les Undercovers ont un mot proche… sans savoir qu'ils sont Undercover. Mr. White n'a aucun mot.\n• Chacun donne UN indice sur son mot, puis on débat et on vote pour éliminer quelqu'un.\n• Mr. White éliminé peut gagner en devinant le mot des Civils.\n• Les Civils gagnent s'ils éliminent tous les Undercovers et Mr. White. Les infiltrés gagnent s'ils tiennent jusqu'à ce qu'il ne reste que 2 joueurs.\n• Les rôles spéciaux ajoutent des pouvoirs secrets : utilise-les avec le bouton [[i:sparkles]].","• Civilians all share the same word. Undercovers have a close word… without knowing they're Undercovers. Mr. White has no word.\n• Everyone gives ONE clue about their word, then you debate and vote someone out.\n• An eliminated Mr. White can win by guessing the Civilians' word.\n• Civilians win by eliminating all Undercovers and Mr. White. Infiltrators win if they last until only 2 players remain.\n• Special roles add secret powers: use them with the [[i:sparkles]] button."],
gotIt:["C'est compris !","Got it!"],
installT:["Installer l'application","Install the app"], useChrome:["Tu utilises {b} : il ne peut créer qu'un simple raccourci. Pour installer la vraie application, ouvre ce lien dans Chrome.","You're using {b}: it can only create a shortcut. To install the real app, open this link in Chrome."], copyLink:["Copier le lien pour l'ouvrir dans Chrome","Copy the link to open it in Chrome"], linkCopied:["Lien copié : colle-le dans Chrome.","Link copied: paste it in Chrome."], diag:["État","Status"], installBtn:["Télécharger New World","Download New World"], installP:["Installe New World sur ton écran d'accueil : elle s'ouvre comme une vraie appli, en plein écran, même sans Internet.","Install New World on your home screen: it opens like a real app, full screen, even offline."],
howInstall:["Comment installer, pas à pas","How to install, step by step"], installedOk:["New World est installée sur ce téléphone.","New World is installed on this phone."],
stepsAndroid:["1. Ouvre le lien de New World dans Chrome, avec Internet. Brave, Opera et les autres navigateurs ne créent qu'un simple raccourci.\n2. Touche le menu ⋮ en haut à droite.\n3. Choisis « Installer l'application » (évite « Ajouter à l'écran d'accueil », qui crée un simple raccourci).\n4. Si l'option n'apparaît pas, recharge la page et réessaie après quelques secondes.\n5. Si tu as déjà une icône New World avec le petit logo de Chrome, c'est un simple raccourci : supprime-la, puis installe l'appli.","1. Open the New World link in Chrome, with Internet. Brave, Opera and other browsers only create a shortcut.\n2. Tap the ⋮ menu at the top right.\n3. Choose \"Install app\" (avoid \"Add to Home screen\", which only creates a shortcut).\n4. If the option doesn't appear, reload the page and try again after a few seconds.\n5. If you already have a New World icon with the small Chrome logo, it's only a shortcut: delete it, then install the app."],
stepsIOS:["1. Ouvre le lien de New World dans Safari.\n2. Touche Partager (le carré avec une flèche).\n3. Choisis « Sur l'écran d'accueil », puis Ajouter.\n4. Ouvre ensuite toujours New World depuis son icône, et active-la depuis là.","1. Open the New World link in Safari.\n2. Tap Share (the square with an arrow).\n3. Choose \"Add to Home Screen\", then Add.\n4. Always open New World from its icon afterwards, and activate it there."],

const LIC = {
  key:null,
  idb(){ return new Promise(res=>{ try{ const r=indexedDB.open("nw_store",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);} }); },
  async idbGet(k){ const db=await this.idb(); if(!db) return null; return new Promise(res=>{ try{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result==null?null:q.result); q.onerror=()=>res(null);}catch(e){res(null);} }); },
  async idbSet(k,v){ const db=await this.idb(); if(!db) return; try{ db.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){} },
  ck(k){ const m=document.cookie.match(new RegExp("(?:^|; )nw_"+k+"=([^;]*)")); return m?decodeURIComponent(m[1]):null; },
  setCk(k,v){ try{ document.cookie="nw_"+k+"="+encodeURIComponent(v)+";max-age=315360000;path=/;SameSite=Lax"; }catch(e){} },
  async read(k){ let v=null; try{ v=localStorage.getItem("nw_l_"+k); }catch(e){} if(v==null) v=this.ck(k); if(v==null) v=await this.idbGet(k); return v; },
  async write(k,v){ try{ localStorage.setItem("nw_l_"+k,v);}catch(e){} this.setCk(k,v); await this.idbSet(k,v); },
  newId(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b=new Uint8Array(8); crypto.getRandomValues(b); let s=""; b.forEach(x=>s+=a[x%a.length]); return "NW-"+s.slice(0,4)+"-"+s.slice(4); },
  b64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; },
  async verify(id, code){
    try{
      if(!crypto.subtle) return false;
      code = String(code||"").replace(/\s+/g,"").replace(/^NWCODE:/i,"");
      const sig = this.b64u(code); if(sig.length!==64) return false;
      this.key = this.key || await crypto.subtle.importKey("jwk", PUBKEY, {name:"ECDSA",namedCurve:"P-256"}, false, ["verify"]);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"}, this.key, sig, new TextEncoder().encode(id));
    }catch(e){ return false; }
  },
  async init(){
    let id = await this.read("id"); if(!id || !/^NW-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(id)) id = this.newId();
    await this.write("id", id);
    const code = await this.read("code");
    if(code && await this.verify(id, code)){ await this.write("code", code); return {id, active:true}; }
    const now = Date.now();
    let start = parseInt(await this.read("start"),10); if(!start || start>now+864e5) start = now;
    let seen = parseInt(await this.read("seen"),10) || now;
    let tamper = (await this.read("tz"))==="1";
    if(now < seen - 10*60*1000) tamper = true;               // heure reculée
    if(tamper) await this.write("tz","1");
    await this.write("start", String(start));
    await this.write("seen", String(Math.max(seen, now)));
    const end = start + APP.trialDays*864e5;
    return {id, active:false, tamper, end, left: end-now, expired: tamper || now>=end};
  },
  async activate(code){ if(await this.verify(ST.lic.id, code)){ await this.write("code", String(code).replace(/\s+/g,"")); ST.lic = {id:ST.lic.id, active:true}; return true; } return false; }
};

const LVALIAS = {soft:"soft",hard:"hard",epice:"spicy",spicy:"spicy",extreme:"extreme"};
function parseCards(txt, defType, defLevel){
  const out=[];
  String(txt).split(/\r?\n/).forEach(line=>{
    let l=line.trim(); if(!l || l.startsWith("#")) return;
    let type=defType, level=defLevel, c=false;
    l=l.replace(/\[([^\]]+)\]/g,(m,k)=>{ const n=norm(k); if(n==="contact"){ c=true; return ""; } if(LVALIAS[n]){ level=LVALIAS[n]; return ""; } return m; });
    const m=l.match(/^\s*(v|a|t|d|verite|action|truth|dare)\s*[:\-–]\s*/i);
    if(m){ const k=norm(m[1]); type=(k==="v"||k==="t"||k==="verite"||k==="truth")?"v":"a"; l=l.slice(m[0].length); }
    l=l.replace(/\s{2,}/g," ").trim(); if(l.length<2) return;
    out.push({text:l.slice(0,220), type, level, c});
  });
  return out;
}
function parsePairs(txt){
  const out=[];
  String(txt).split(/\r?\n/).forEach(line=>{
    const l=line.trim(); if(!l || l.startsWith("#")) return;
    const parts=l.split(/\s*(?:\/|;|\t|\||\s-\s|,)\s*/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>=2 && norm(parts[0])!==norm(parts[1])) out.push([parts[0].slice(0,40), parts[1].slice(0,40)]);
  });
  return out;
}
function cardsToText(list){ return "# New World — "+(L()?"custom cards":"cartes perso")+"\n"+list.map(c=>`[${c.level==="spicy"?"spicy":c.level==="extreme"?"extreme":c.level}] ${c.type==="v"?(L()?"T":"V"):(L()?"D":"A")}: ${c.text}${c.c?" [contact]":""}`).join("\n")+"\n"; }
function packToText(p){ return "# New World — pack : "+p.name+"\n"+p.pairs.map(x=>x[0]+" / "+x[1]).join("\n")+"\n"; }
function fileName(n){ return "new-world-"+norm(n||"export").slice(0,30)+".txt"; }
function download(name, text){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
async function shareText(name, text){ try{ const f=new File([text], name, {type:"text/plain"}); if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:"New World"}); else download(name,text); }catch(e){} }
function pickFile(targetId){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".txt,.csv,text/plain";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f || f.size>500000) return; const r=new FileReader(); r.onload=()=>{ const el=$("#"+targetId); if(!el) return; el.value=String(r.result);
    const first=String(r.result).split(/\r?\n/)[0]; const m=first.match(/pack\s*:\s*(.+)$/i); const nameEl=$(targetId==="ptext"?"#pname":targetId==="ltext"?"#lname":"#sname"); if(nameEl && !nameEl.value) nameEl.value=(m?m[1]:f.name.replace(/\.[^.]+$/,"").replace(/^new-world-/,"")).slice(0,40); }; r.readAsText(f); };
  inp.click();
}

function todNew(limitTurns, onlyPlayers){
  const c = ST.todCfg;
  ST.tod = { start:Date.now(), turn:0, idx:-1, cur:null, phase:"spin", card:null, used:{}, rule:null, angle:0, limit:limitTurns||0, only:onlyPlayers||null,

}
function todLevelFor(p){
  const c=ST.todCfg;
  if(c.mode==="rise"){ return LEVELS[Math.min(3, Math.floor((Date.now()-ST.tod.start)/600000))]; }
  if(c.mode==="own"){ const max=LEVELS.indexOf(p.max||"hard"); const w=[]; for(let i=0;i<=max;i++) for(let k=0;k<=i;k++) w.push(LEVELS[i]); return pick(w); }
  return pick(c.levels.length?c.levels:["soft"]);
}
const accepts = (a,b) => a.c && b.c && (a.w==="all" || a.w===b.g) && (b.w==="all" || b.w===a.g);
function targetFor(p, card, lv){
  const others = ST.players.filter(x=>x.id!==p.id);
  let pool = others;
  if(card.c){ if(!ST.todCfg.contact) return null; pool = others.filter(o=>accepts(p,o) && (ST.todCfg.mode!=="own" || LEVELS.indexOf(o.max||"hard")>=LEVELS.indexOf(lv))); }
  return pool.length ? pick(pool) : null;
}
function todDraw(type){
  const p = ST.tod.cur; const lv = todLevelFor(p);
  let pool = CARDS[lv][type].map((x,i)=>({key:lv+type+i, text:L()?x[1]:x[0], c:!!x[2]}));
  if(ST.todCfg.custom) ST.custom.forEach((x,i)=>{ if(x.level===lv && x.type===type) pool.push({key:"u"+i, text:x.text, c:!!x.c}); });
  for(let attempt=0; attempt<2; attempt++){
    const fresh = shuffle(pool.filter(x=>!ST.tod.used[x.key]));
    for(const card of fresh){
      const needs = card.c || card.text.includes("{p}");
      const tgt = needs ? targetFor(p, card, lv) : null;
      if(needs && !tgt) continue;
      ST.tod.used[card.key]=1;
      return {type, lv, c:card.c, tgt, text:card.text.split("{p}").join(tgt?tgt.name:"")};
    }
    pool.forEach(x=>delete ST.tod.used[x.key]);
  }
  return {type, lv, c:false, tgt:null, text: L()?"Raconte ton meilleur souvenir avec ce groupe.":"Tell your best memory with this group."};
}

AFTER.todPlay = () => { if(ST.tod.phase==="spin" && ST.todCfg.wheel) drawWheel(ST.tod.angle); };
const WCOL = ["#8b5cf6","#ec4899","#f97316","#0ea5e9","#22c55e","#eab308","#6366f1","#ef4444","#14b8a6","#a855f7"];
function drawWheel(ang){
  const cv=$("#wheel"); if(!cv) return; const x=cv.getContext("2d"), ps=todEligible(), n=ps.length, R=290, C=300;
  x.clearRect(0,0,600,600);
  for(let i=0;i<n;i++){ const a0=ang+i*2*Math.PI/n - Math.PI/2, a1=a0+2*Math.PI/n;
    x.beginPath(); x.moveTo(C,C); x.arc(C,C,R,a0,a1); x.closePath(); x.fillStyle=WCOL[i%WCOL.length]; x.fill(); x.strokeStyle="#0d0b1a"; x.lineWidth=4; x.stroke();
    x.save(); x.translate(C,C); x.rotate((a0+a1)/2); x.textAlign="right"; x.fillStyle="#fff"; x.font="bold "+(n>8?28:36)+"px system-ui"; x.fillText(ps[i].name.slice(0,12), R-24, 12); x.restore(); }
  x.beginPath(); x.arc(C,C,38,0,2*Math.PI); x.fillStyle="#0d0b1a"; x.fill(); x.fillStyle="#fff"; x.font="bold 30px system-ui"; x.textAlign="center"; x.fillText("NW",C,C+10);
}
function todSpin(){
  const T=ST.tod, ps=todEligible();
  if(!ST.todCfg.wheel){ T.idx=(T.idx+1)%ps.length; return todAfterPick(ps[T.idx]); }
  const btn=$("#spinBtn"); if(btn) btn.disabled=true;
  let target = rnd(ps.length); if(ps.length>2 && T.cur && ps[target].id===T.cur.id) target=(target+1)%ps.length;
  const seg=2*Math.PI/ps.length; const end = 2*Math.PI*(5+rnd(3)) + (2*Math.PI - (target*seg+seg/2));
  const from=T.angle%(2*Math.PI), t0=performance.now(), dur=3200; let lastSeg=-1;
  (function step(now){ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3), a=from+(end-from)*e; drawWheel(a);
    const s=Math.floor(((2*Math.PI-(a%(2*Math.PI)))%(2*Math.PI))/seg); if(s!==lastSeg){ lastSeg=s; beep("tick"); }
    if(k<1) requestAnimationFrame(step); else { T.angle=a; beep("reveal"); setTimeout(()=>todAfterPick(ps[target]),450); } })(t0);
}
function todAfterPick(p){
  const T=ST.tod; T.cur=p; T.turn++;
  if(T.rule){ T.rule.n--; if(T.rule.n<=0) T.rule=null; }
  if(ST.todCfg.specials && !T.only && T.turn>2 && Math.random()<0.15){ T.card=todSpecial(); T.phase="special"; }
  else T.phase="choose";
  render();
}
function todNext(){
  const T=ST.tod; T.phase="spin"; T.card=null;
  if(T.limit && T.turn>=T.limit){ return partyAfterTod(); }
  render();
}

function inPairPool(){
  const c=ST.inCfg; let pool=[];
  c.themes.forEach(k=>THEMES[k] && pool.push(...THEMES[k].pairs));
  c.packs.forEach(k=>PACKS[k] && pool.push(...PACKS[k].pairs));
  (c.mine||[]).forEach(id=>{ const p=ST.myPacks.find(x=>x.id===id); if(p) pool.push(...p.pairs); });
  return pool.length?pool:THEMES.food.pairs;
}
function inNew(){
  const c=ST.inCfg, ps=shuffle(ST.players);
  const usedPairs = ST.game && ST.game.usedPairs || {};
  let pool=inPairPool(); let fresh=pool.filter(p=>!usedPairs[p.join("/")]); if(!fresh.length){ fresh=pool; for(const k in usedPairs) delete usedPairs[k]; }
  let pair=pick(fresh); usedPairs[pair.join("/")]=1; if(Math.random()<.5) pair=[pair[1],pair[0]];
  const pl = ps.map(p=>({id:p.id, name:p.name, team:"civ", word:pair[0], alive:true, role:null, used:false, prot:false}));
  let k=0; for(let i=0;i<c.intrus;i++){ pl[k].team="intr"; pl[k].word=pair[1]; k++; }
  if(c.white){ pl[k].team="white"; pl[k].word=null; k++; }
  // rôles
  let roles = shuffle(c.roles.slice()); const order=shuffle(pl.map((_,i)=>i)); let nb=Math.min(c.rolesNb, pl.length); const assign=[];
  for(const r of roles){ if(assign.length>=nb) break; if(r==="jumeaux"){ if(assign.length+2>nb) continue; assign.push("jumeaux","jumeaux"); } else assign.push(r); }
  assign.slice(0,pl.length).forEach((r,i)=>{ pl[order[i]].role=r; });
  const tw=pl.filter(p=>p.role==="jumeaux"); if(tw.length===1) tw[0].role=null; if(tw.length===2){ tw[0].twin=tw[1].id; tw[1].twin=tw[0].id; }
  pl.forEach(p=>{ if(p.role==="vendeur") p.vend=pick(Object.keys(VENDOR)); });
  const scores = ST.game && ST.game.scores || Object.fromEntries(ST.players.map(p=>[p.id,0]));
  const manche = ST.game ? ST.game.manche+1 : 1;
  ST.game = { hadIntr: c.intrus>0, pl, pair, phase:"reveal", ri:0, shown:false, round:1, votes:0, first:null, scores, manche, usedPairs, log:[], gossip:null, pending:null };
}

let PW = null; // {who, step, ability, result}
function powersOf(p){
  const out=[];
  if(!p.alive) return out;
  if(p.role==="griot" && !p.used) out.push("check");
  if(p.role==="detective" && !p.used) out.push("peek");
  if(p.role==="commere" && !p.used) out.push("gossip");
  if(p.role==="marchand" && !p.used) out.push("swap");
  if(p.role==="vendeur" && !p.used && (p.vend==="peek"||p.vend==="check")) out.push(p.vend);
  return out;
}
const PWL = {check:["[[i:drum]] Savoir si un joueur a mon mot","[[i:drum]] Check if a player has my word"], peek:["[[i:search]] Voir le mot d'un joueur","[[i:search]] See a player's word"], gossip:["[[i:megaphone]] Révéler le camp d'un joueur au hasard","[[i:megaphone]] Reveal a random player's side"], swap:["[[i:repeat]] Échanger mon mot avec un joueur","[[i:repeat]] Swap my word with a player"]};

function pwApply(targetId){

function vtTally(){
  const g=G(), tally={};

let RES = null; // {msgs:[], next}
function inEliminate(id){
  const g=G(); g.votes++; const p=gp(id); const msgs=[];
  const guard=g.pl.find(x=>x.role==="garde" && x.guard===id && !x.gUsed);
  if(guard){ guard.gUsed=true; msgs.push(t("saved",{p:p.name})); RES={msgs, next:"round"}; beep("ok"); return go("inResult"); }
  if(p.role==="lutteur" && !p.lUsed){ p.lUsed=true; msgs.push(t("wrestler",{p:p.name})); RES={msgs, next:"round"}; beep("ok"); return go("inResult"); }
  if(p.role==="vendeur" && p.vend==="immune" && !p.used){ p.used=true; msgs.push(t("immune",{p:p.name})); RES={msgs, next:"round"}; beep("ok"); return go("inResult"); }
  inKill(p, msgs);
  if(p.role==="bouffon" && g.votes===1){ return inEnd("jester", msgs, p); }
  if(p.twin){ const tw=gp(p.twin); if(tw.alive){ inKill(tw, msgs, true); } }
  const whites=[p, p.twin?gp(p.twin):null].filter(x=>x && x.team==="white");
  RES={msgs, next:"check", white: whites.length?whites[0].id:null, avenger: p.role==="vengeur"?p.id:(p.twin && gp(p.twin).role==="vengeur"?p.twin:null)};
  beep("bad"); go("inResult");
}

let BLA = {}; // affectation joueur -> équipe
let BG = null; // partie en cours

const blSave = () => lsSet("blCfg", ST.blCfg);
const blTeamName = i => t("team",{c:BL_COLORS[i][L()]});
const blN = () => ST.players.length;
const blMaxTeams = () => Math.max(2, Math.min(4, Math.floor(blN()/2)));
const blMode = () => (ST.blCfg.mode==="teams" && blN()>=4) ? "teams" : "solo";
const blKinds = () => [0,1,2].filter(k=>ST.blCfg.rounds[k]);
function blDeal(){ const c=ST.blCfg; c.nTeams=Math.min(c.nTeams, blMaxTeams()); BLA={}; shuffle(ST.players).forEach((p,i)=>BLA[p.id]=i%c.nTeams); }
function blAssignOk(){ const c=ST.blCfg; return ST.players.every(p=>BLA[p.id]!=null && BLA[p.id]<c.nTeams); }
function blPool(){
  const c=ST.blCfg, seen={}, out=[];
  const add = w => { const k=norm(String(w).split("|")[0]); if(k && !seen[k]){ seen[k]=1; out.push(w); } };
  c.themes.forEach(k=>{ if(BLITZ[k]) BLITZ[k].words.forEach(add); else if(THEMES[k]) THEMES[k].pairs.forEach(p=>p.forEach(add)); });
  c.packs.forEach(k=>PACKS[k] && PACKS[k].pairs.forEach(p=>p.forEach(add)));
  (c.mine||[]).forEach(id=>{ const l=ST.blLists.find(x=>x.id===id); if(l) l.words.forEach(add); });
  return out;
}

function parseWords(txt){ const seen={}, out=[]; String(txt).split(/\r?\n/).forEach(line=>{ const l=line.trim(); if(!l||l.startsWith("#")) return; l.split(/\s*[,;\t]\s*/).forEach(w=>{ w=w.trim().slice(0,50); const k=norm(w); if(k && !seen[k]){ seen[k]=1; out.push(w); } }); }); return out; }

/* ---- Moteur ---- */
function blNew(ownWords){
  const c=ST.blCfg, mode=blMode(), own=ownWords||[];
  const seen={}; own.forEach(w=>seen[norm(w)]=1);
  const pool = shuffle(blPool().filter(w=>!seen[norm(String(w).split("|")[0])]));
  const words = shuffle(own.concat(pool.slice(0, Math.max(0, c.nb-own.length))));
  BG = { mode, kinds:blKinds(), ri:0, words, pile:[], ti:0, si:0, carry:0, turn:null,
    teams: mode==="teams" ? Array.from({length:c.nTeams},(_,i)=>({i, ids:shuffle(ST.players.filter(p=>BLA[p.id]===i)).map(p=>p.id), si:0, pts:[0,0,0]})) : [],
    order: shuffle(ST.players).map(p=>p.id), pts:Object.fromEntries(ST.players.map(p=>[p.id,[0,0,0]])),
    made:{}, guessed:{}, best:{n:0, id:null}, rstart:{} };
  blRoundStart();
}
function blRoundStart(){ BG.pile = shuffle(BG.words); BG.rstart = blTotals(); go("blIntro"); }
const blPname = id => { const p=ST.players.find(x=>x.id===id); return p?p.name:"?"; };
function blSpeaker(){ if(BG.mode==="teams"){ const tm=BG.teams[BG.ti]; return tm.ids[tm.si%tm.ids.length]; } return BG.order[BG.si%BG.order.length]; }
function blTotals(){ const o={}; if(BG.mode==="teams") BG.teams.forEach(tm=>o["t"+tm.i]=tm.pts.reduce((a,b)=>a+b,0)); else for(const id in BG.pts) o[id]=BG.pts[id].reduce((a,b)=>a+b,0); return o; }
function blRanking(){ // [{key,name,color,total,pts}]
  const rows = BG.mode==="teams" ? BG.teams.map(tm=>({key:"t"+tm.i, name:blTeamName(tm.i), color:BL_COLORS[tm.i][2], sub:tm.ids.map(blPname).join(", "), pts:tm.pts, ids:tm.ids}))
    : ST.players.map(p=>({key:p.id, name:p.name, color:null, sub:"", pts:BG.pts[p.id], ids:[p.id]}));
  rows.forEach(r=>r.total=r.pts.reduce((a,b)=>a+b,0)); return rows.sort((a,b)=>b.total-a.total);
}
function blScoreTable(showRounds){ const rows=blRanking(), ks=BG.kinds;
  return `<table class="score">${showRounds?`<tr class="mut small"><td></td>${ks.map(k=>`<td style="text-align:right">[[i:${BL_KIND_IC[k]}]]</td>`).join("")}<td style="text-align:right">${t("blTotal")}</td></tr>`:""}${rows.map((r,i)=>`<tr><td>${i===0&&r.total>0?"[[i:crown]] ":""}<b style="${r.color?"color:"+r.color:""}">${esc(r.name)}</b>${r.sub?`<div class="mut small">${esc(r.sub)}</div>`:""}</td>${showRounds?ks.map(k=>`<td style="text-align:right" class="mut">${r.pts[k]}</td>`).join(""):""}<td style="text-align:right"><b style="font-size:1.15rem">${r.total}</b></td></tr>`).join("")}</table>`; }

  const col = BG.mode==="teams" ? BL_COLORS[BG.teams[BG.ti].i][2] : "var(--pri2)";
  const btns = BG.mode==="teams"
    ? `<div class="choice"><button class="btn blpass" data-a="blPass">[[i:skip]]<br>${t("blPass")}</button><button class="btn blfound" data-a="blFound" data-v="">[[i:check]]<br>${t("blFound")}</button></div>`
    : `<div class="mut small center">${t("blWhoFound")}</div><div class="grid2">${ST.players.filter(p=>p.id!==spk).map(p=>`<button class="btn blfound" style="margin:0;padding:22px 8px" data-a="blFound" data-v="${p.id}">[[i:check]] ${esc(p.name)}</button>`).join("")}</div><button class="btn blpass" data-a="blPass">[[i:skip]] ${t("blPass")}</button>`;
  return `<div class="spread"><span class="pill" style="border-color:${col}">${esc(blPname(spk))}</span><b id="bt" class="bltimer ${blLeftMs()<=5000?"hot":""}">${Math.ceil(blLeftMs()/1000)}</b><button class="btn sm ghost" style="width:auto" data-a="blPause">[[i:timer]] ${t("blPause")}</button></div>
  <div class="blbar"><div id="bbar" style="width:${100*blLeftMs()/(tr.dur*1000)}%;background:${col}"></div></div>
  <div class="bigcard blword" style="border-color:${col}"><div class="mut small">${t("r"+BG.kinds[BG.ri])}</div><div class="q" style="font-size:${blSize(w)}">${esc(w)}</div><div class="mut small">[[i:check]] ${tr.found.length} · ${esc(t("blLeft",{n:BG.pile.length+1}))}</div></div>
  ${btns}
  ${tr.paused!=null?`<div class="modal"><div class="box center"><h2>[[i:timer]] ${t("blPaused")}</h2><p class="mut">${Math.ceil(tr.paused/1000)} s</p><button class="btn pri" data-a="blResume">${t("blResume")}</button><button class="btn ghost" data-a="blQuitAsk">${t("blQuit")}</button></div></div>`:""}`; };
const blLeftMs = () => { const tr=BG.turn; return tr.paused!=null ? tr.paused : Math.max(0, tr.end-Date.now()); };
let WAKE=null;
function blWake(on){ try{ if(on){ if(!WAKE && navigator.wakeLock) navigator.wakeLock.request("screen").then(w=>WAKE=w).catch(()=>{}); } else if(WAKE){ WAKE.release(); WAKE=null; } }catch(e){} }
AFTER.blPlay = () => { const tr=BG.turn; if(timerInt) return;
  if(tr.phase==="count"){ timerInt=setInterval(()=>{ tr.count--; if(tr.count<=0){ clearInterval(timerInt); timerInt=null; tr.phase="play"; tr.end=Date.now()+tr.dur*1000; tr.cur=BG.pile.shift(); beep("reveal"); render(); } else { beep("tick"); render(); } },800); return; }
  if(tr.paused!=null) return;
  let lastS=Math.ceil(blLeftMs()/1000);
  timerInt=setInterval(()=>{ const ms=blLeftMs(), s=Math.ceil(ms/1000); const e=$("#bt"), b=$("#bbar"); if(e) e.textContent=s; if(b) b.style.width=(100*ms/(tr.dur*1000))+"%";
    if(s!==lastS){ lastS=s; if(s<=5 && s>0){ beep("tick"); if(e) e.classList.add("hot"); } }
    if(ms<=0){ clearInterval(timerInt); timerInt=null; BG.pile.push(tr.cur); tr.cur=null; beep("time"); blTurnEnd("time"); } },200); };
function blTurnEnd(why){ const tr=BG.turn; tr.why=why; tr.leftS = why==="empty" ? Math.floor(blLeftMs()/1000) : 0; tr.cancel={}; blWake(false); go("blTurn"); }

SCREENS.blTurn = () => { const tr=BG.turn, c=ST.blCfg;
  const ok=tr.found.filter((f,i)=>!tr.cancel[i]).length, pen=c.passPen?tr.passes:0;
  return `<div class="center"><div class="logo" style="font-size:2rem">${tr.why==="time"?t("blTimeUp"):t("blEmpty")}</div><div class="mut">${esc(blPname(tr.spk))}</div></div>
  <div class="card">${tr.found.length?`<p class="mut small" style="margin-top:0">${t("blCheck")}</p><div>${tr.found.map((f,i)=>`<span class="pill ${tr.cancel[i]?"":"on"}" style="${tr.cancel[i]?"text-decoration:line-through;opacity:.6":""}" data-a="blCancel" data-v="${i}">${tr.cancel[i]?"[[i:x]]":"[[i:check]]"} ${esc(wfr(f.w))}${f.by?` <small>· ${esc(blPname(f.by))}</small>`:""}</span>`).join("")}</div>`:`<p class="mut">${t("blNone")}</p>`}
  ${tr.passes?`<p class="mut small">[[i:skip]] ${t("blPassesN",{n:tr.passes})}${pen?" (−"+pen+")":""}</p>`:""}
  <h3 style="margin:10px 0 0">${t("blTurnPts",{n:ok-pen})}</h3></div>
  ${tr.why==="empty" && tr.leftS>=3 && BG.ri<BG.kinds.length-1 && !Object.keys(tr.cancel).some(k=>tr.cancel[k])?`<div class="banner info">[[i:timer]] ${esc(t("blCarry",{n:tr.leftS,p:blPname(tr.spk)}))}</div>`:""}
  <button class="btn pri" data-a="blValidate">${t("blValidate")}</button>`; };

function blApplyTurn(){
  const tr=BG.turn, c=ST.blCfg, k=BG.kinds[BG.ri];
  const good=tr.found.filter((f,i)=>!tr.cancel[i]); tr.found.forEach((f,i)=>{ if(tr.cancel[i]) BG.pile.push(f.w); });
  BG.pile=shuffle(BG.pile);
  const pen=c.passPen?tr.passes:0;
  if(BG.mode==="teams") BG.teams[BG.ti].pts[k]+=good.length-pen;
  else { BG.pts[tr.spk][k]+=good.length-pen; good.forEach(f=>{ if(f.by){ BG.pts[f.by][k]++; BG.guessed[f.by]=(BG.guessed[f.by]||0)+1; } }); }
  BG.made[tr.spk]=(BG.made[tr.spk]||0)+good.length;
  if(good.length>BG.best.n) BG.best={n:good.length, id:tr.spk};
  const emptied = BG.pile.length===0;
  const carry = emptied && tr.why==="empty" && tr.leftS>=3 && BG.ri<BG.kinds.length-1 ? tr.leftS : 0;
  BG.carry = carry;
  if(!carry){ // rotation normale
    if(BG.mode==="teams"){ BG.teams[BG.ti].si++; BG.ti=(BG.ti+1)%BG.teams.length; } else BG.si++;
  }
  BG.turn=null;
  if(emptied){ beep("win"); go("blRound"); } else go("blReady");
}

SCREENS.blRound = () => { const last=BG.ri>=BG.kinds.length-1;
  return `<div class="center"><div class="logo" style="font-size:2rem">${t("blRoundEnd",{n:BG.ri+1})}</div><div class="mut">${t("r"+BG.kinds[BG.ri])}</div></div>

  ${last?`<button class="btn pri" data-a="blFinal">[[i:trophy]] ${t("blFinal")}</button>`:`<button class="btn pri" data-a="blNextRound">${esc(t("blNextRound",{r:t("r"+BG.kinds[BG.ri+1])}))}</button>`}`; };

function blLosers(){ const rows=blRanking(); if(rows.length<2) return []; const min=rows[rows.length-1].total; if(rows[0].total===min) return []; return rows.filter(r=>r.total===min).flatMap(r=>r.ids); }
SCREENS.blEnd = () => { const rows=blRanking(), top=rows[0].total, win=rows.filter(r=>r.total===top);
  const title = win.length>1 ? t("blTieW",{w:win.map(r=>r.name).join(" & ")}) : t("blWinner",{w:win[0].name});
  const maxOf = o => { let m=0,id=null; for(const k in o) if(o[k]>m){ m=o[k]; id=k; } return id?{id,n:m}:null; };
  const sp=maxOf(BG.made), gs=BG.mode==="solo"?maxOf(BG.guessed):null;
  const aw=(icon,ttl,who,desc)=>`<div class="title-award"><span class="e">[[i:${icon}]]</span><div><b>${ttl}</b><div>${esc(who)} <span class="mut small">· ${desc}</span></div></div></div>`;
  return `<div class="center"><div class="blic big">[[i:trophy]]</div><div class="logo" style="font-size:2rem;margin-top:4px">${esc(title)}</div></div>
  <div class="card"><h3>[[i:trophy]] ${t("scores")}</h3>${blScoreTable(BG.kinds.length>1)}</div>
  ${sp||BG.best.id||gs?`<div class="card">${sp?aw("megaphone",t("blAwSpeaker"),blPname(sp.id),t("blAwSpeakerD",{n:sp.n})):""}${BG.best.id?aw("zap",t("blAwTurn"),blPname(BG.best.id),t("blAwTurnD",{n:BG.best.n})):""}${gs?aw("search",t("blAwGuess"),blPname(gs.id),t("blAwGuessD",{n:gs.n})):""}</div>`:""}
  ${ST.blCfg.gage&&blLosers().length?`<button class="btn warn" data-a="blGages">[[i:flame]] ${t("gages")}</button>`:""}
  <button class="btn pri" data-a="blRematch">[[i:repeat]] ${t("blRematch")}</button>
  <button class="btn ghost" data-a="go" data-v="blSetup">[[i:sliders]] ${t("blChange")}</button>
  <button class="btn ghost" data-a="go" data-v="home">${t("home")}</button>`; };

    if(ok){ const w=gp(RES.white); RES=null; return inEndWhite(w); }
    RES.white=null; beep("bad"); render(); },
  inAvenge: v => { const tg=gp(v); const msgs=RES.msgs; RES.avenger=null; inKill(tg, msgs); if(tg.twin && gp(tg.twin).alive) inKill(gp(tg.twin), msgs, true); if(tg.team==="white") RES.white=tg.id; beep("bad"); render(); },
  inAfter: () => { if(RES && RES.next==="round"){ RES=null; const g=G(); g.round++; return inStartRound(); } RES=null; inAfter(); },
  inQuit: () => { if(confirmQuit()) go("home"); },
  inGages: () => { GAGE={list:END.losers.slice(), i:0, card:null}; go("inGage"); },
  gagePick: v => { GAGE.card=gageDraw(v); beep("reveal"); render(); },
  gageRefuse: () => { GAGE.card=gageDraw(GAGE.card.type); render(); },
  gageNext: () => { GAGE.i++; GAGE.card=null; beep("ok"); if(GAGE.i>=GAGE.list.length) go(GAGE.back||"inEnd"); else render(); },
  // Soirée
  partyLv: v => { const f=()=>{ ST.party.lv=v; render(); }; ADULT.includes(v)?adultGate(f):f(); },
  partyStart: () => { if(ST.players.length<3) return toast(t("minP",{n:3})); const f=()=>{ ST.game=null; inNew(); go("inReveal"); if(!ST.set.seenRules.intrus) rulesModal("intrus"); }; ADULT.includes(ST.party.lv)?adultGate(f):f(); },
  partyTod: () => partyTod()
};
/* ---- Actions Blitz ---- */
Object.assign(ACT, {
  blSet: v => { const [k,val]=v.split("|"); const c=ST.blCfg; c[k] = (k==="mode") ? val : +val; if(k==="mode" && val==="teams" && blN()<4) toast(t("blNeed4")); blSave(); render(); },
  blTog: v => { ST.blCfg[v]=!ST.blCfg[v]; blSave(); render(); },
  blGL: v => { const f=()=>{ ST.blCfg.gageLv=v; blSave(); render(); }; ADULT.includes(v)?adultGate(f):f(); },
  blNT: v => { const c=ST.blCfg; const n=Math.max(2, Math.min(blMaxTeams(), c.nTeams+(+v))); if(n!==c.nTeams){ c.nTeams=n; blSave(); blDeal(); } render(); },
  blDeal: () => { blDeal(); beep("spin"); render(); },
  blMove: v => { BLA[v]=(BLA[v]+1)%ST.blCfg.nTeams; render(); },
  blRound: v => { const c=ST.blCfg; c.rounds[+v]=!c.rounds[+v]; if(!c.rounds.some(Boolean)){ c.rounds[+v]=true; toast(t("blRoundsMin")); } blSave(); render(); },
  blTheme: v => { const c=ST.blCfg; c.themes = c.themes.includes(v)?c.themes.filter(x=>x!==v):c.themes.concat(v); blSave(); render(); },
  blPack: v => { const c=ST.blCfg; c.packs = c.packs.includes(v)?c.packs.filter(x=>x!==v):c.packs.concat(v); blSave(); render(); },
  blMine: v => { const c=ST.blCfg; c.mine=c.mine||[]; c.mine = c.mine.includes(v)?c.mine.filter(x=>x!==v):c.mine.concat(v); blSave(); render(); },
  blAll: v => { const c=ST.blCfg; if(v==="1"){ c.themes=Object.keys(BLITZ).concat(Object.keys(THEMES)); c.packs=Object.keys(PACKS); } else { c.themes=[]; c.packs=[]; } blSave(); render(); },
  openBlLists: v => { BACKTO=v||"settings"; go("blLists"); },
  blImport: () => { const words=parseWords($("#ltext").value); if(!words.length) return toast(t("nothing"));
    const name=($("#lname").value.trim()||(L()?"My list ":"Ma liste ")+(ST.blLists.length+1)).slice(0,40); const id=uid();
    ST.blLists.push({id, name, words}); lsSet("blLists", ST.blLists); const c=ST.blCfg; c.mine=(c.mine||[]).concat(id); blSave(); toast(t("imported",{n:words.length})); render(); },
  blExport: v => { const l=ST.blLists.find(x=>x.id===v); download(fileName("blitz-"+l.name), listToText(l)); },
  blShare: v => { const l=ST.blLists.find(x=>x.id===v); shareText(fileName("blitz-"+l.name), listToText(l)); },
  blDelList: v => { ST.blLists=ST.blLists.filter(x=>x.id!==v); lsSet("blLists", ST.blLists); ST.blCfg.mine=(ST.blCfg.mine||[]).filter(x=>x!==v); blSave(); render(); },
  blStart: () => {
    if(!canPlay()) return go("lock");
    const c=ST.blCfg;
    if(blN()<3) return toast(t("minP",{n:3}));
    if(blMode()==="teams"){ if(!blAssignOk()) blDeal(); for(let i=0;i<c.nTeams;i++) if(ST.players.filter(p=>BLA[p.id]===i).length<2) return toast(t("blTeamSmall")); }
    if(!c.own && blPool().length<5) return toast(t("nothing"));
    if(c.own){ OWN={i:0, shown:false, words:[]}; return go("blOwn"); }
    blNew(); if(!ST.set.seenRules.blitz) rulesModal("blitz");
  },
  blOwnShow: () => { OWN.shown=true; beep("reveal"); render(); },
  blOwnNext: () => { document.querySelectorAll(".ownw").forEach(e=>{ const w=e.value.trim().slice(0,50); if(w) OWN.words.push(w); }); OWN.i++; OWN.shown=false;
    if(OWN.i>=ST.players.length){ const seen={}, ws=OWN.words.filter(w=>{ const k=norm(w); if(!k||seen[k]) return false; seen[k]=1; return true; }); OWN=null; blNew(ws); if(!ST.set.seenRules.blitz) rulesModal("blitz"); } else render(); },
  blReady: () => go("blReady"),
  blGo: () => { const dur=BG.carry||ST.blCfg.time; BG.carry=0; BG.turn={spk:blSpeaker(), dur, phase:"count", count:3, found:[], passes:0, cur:null, end:0, paused:null}; blWake(true); beep("tap"); go("blPlay"); },
  blFound: v => { const tr=BG.turn; if(!tr||tr.phase!=="play"||tr.paused!=null||!tr.cur) return; tr.found.push({w:tr.cur, by:v||null}); beep("found");
    if(!BG.pile.length){ tr.cur=null; clearInterval(timerInt); timerInt=null; return blTurnEnd("empty"); }
    tr.cur=BG.pile.shift(); render(); },
  blPass: () => { const tr=BG.turn; if(!tr||tr.phase!=="play"||tr.paused!=null||!tr.cur) return; tr.passes++; beep("pass"); BG.pile.push(tr.cur); tr.cur=BG.pile.shift(); render(); },
  blPause: () => { const tr=BG.turn; if(!tr||tr.phase!=="play"||tr.paused!=null) return; tr.paused=blLeftMs(); clearInterval(timerInt); timerInt=null; render(); },
  blResume: () => { const tr=BG.turn; if(!tr||tr.paused==null) return; tr.end=Date.now()+tr.paused; tr.paused=null; render(); },
  blCancel: v => { const tr=BG.turn; tr.cancel[+v]=!tr.cancel[+v]; render(); },
  blValidate: () => blApplyTurn(),
  blNextRound: () => { BG.ri++; blRoundStart(); },
  blFinal: () => { beep("win"); go("blEnd"); },
  blRematch: () => { if(!canPlay()) return go("lock"); ACT.blStart(); },
  blGages: () => { GAGE={list:blLosers(), i:0, card:null, back:"blEnd", lv:ST.blCfg.gageLv}; go("inGage"); },
  blQuitAsk: () => { const tr=BG&&BG.turn; if(tr && tr.phase==="play" && tr.paused==null) ACT.blPause(); modal(`<h2>${t("blQuitT")}</h2><p class="mut">${t("blQuitP")}</p><button class="btn bad" data-a="blQuit">${t("blQuit")}</button><button class="btn ghost" data-a="closeModal">${t("blStay")}</button>`); },
  blQuit: () => { closeModal(); blWake(false); BG=null; go("home"); }
});
let NOTICE_BACK=null;
function inEndWhite(w){ inEnd("white", [], null); }
function confirmQuit(){ return true; }
function afterPlayers(){
  if(NEXT==="tod") go("todSetup");
  else if(NEXT==="blitz"){ if(ST.players.length<3) return toast(t("minP",{n:3})); BG=null; go("blSetup"); }
  else if(NEXT==="intrus"){ if(ST.players.length<3) return toast(t("minP",{n:3})); ST.game=null; go("inSetup"); }
  else { if(ST.players.length<3) return toast(t("minP",{n:3})); ST.game=null; go("partySetup"); }
}

/* ---------- Évènements ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  if(el.tagName==="A" && el.getAttribute("href")!=="#") return;
  e.preventDefault(); const f=ACT[el.dataset.a]; if(f){ if(!["todSpin","vtCast","todDone","todPick","blFound","blPass","blGo"].includes(el.dataset.a)) beep("tap"); f(el.dataset.v); }
});
document.addEventListener("input", e => {
  const el=e.target; if(!el.dataset || !el.dataset.in) return;
  if(el.dataset.in==="pname") EDIT.players[+el.dataset.i].name=el.value;
  if(el.dataset.in==="gname") EDIT.name=el.value;
});

/* ---------- Démarrage ---------- */
(async function(){
  document.documentElement.lang = ST.set.lang;
  $("#app").innerHTML = `<div class="center" style="margin-top:40vh"><div class="logo">New World</div></div>`;
  ST.lic = await LIC.init();
  render();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
})();
</script>
